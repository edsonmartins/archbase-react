name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  # Disparo manual: a reexecucao de uma tag usa o workflow congelado no commit dela,
  # entao sem isto nao ha como rodar uma versao corrigida do pipeline sem mover a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted  # Roda na VPS usando login existente
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Remove local .npmrc and configure NPM registry
        run: |
          rm -f .npmrc
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set @archbase:registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:prod-only

      - name: Pack packages
        run: pnpm run pack

      # Diagnostico da credencial, antes de tentar publicar.
      #
      # O publish vinha falhando com E404 no PUT — que o npm devolve no lugar de 403 para
      # nao revelar existencia de pacote a quem nao tem escrita. Sem saber se o token chega
      # ao npm, se ele autentica e se alcanca o escopo, o conserto vira tentativa e erro.
      #
      # O token nao aparece na saida: setup-node grava o placeholder ${NODE_AUTH_TOKEN} no
      # userconfig, e o sed mascara o valor de qualquer forma. Nenhum comando aqui falha o
      # job — o objetivo e chegar ao publish com as tres respostas ja no log.
      - name: Diagnostico de autenticacao no npm
        run: |
          echo "== userconfig: ${NPM_CONFIG_USERCONFIG:-(nao definido)}"
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed 's/\(_authToken=\).*/\1***/' "$NPM_CONFIG_USERCONFIG"
          else
            echo ">>> userconfig AUSENTE — a credencial nao chega ao npm"
          fi
          echo "== NODE_AUTH_TOKEN definido: $([ -n "$NODE_AUTH_TOKEN" ] && echo sim || echo NAO)"
          echo "== whoami:"
          npm whoami --registry=https://registry.npmjs.org || echo ">>> whoami FALHOU"
          echo "== pacotes que este token alcanca em @archbase:"
          npm access list packages @archbase 2>&1 | head -5 || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM
        run: pnpm publish -r --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ github.ref_name }}

          # O actions/checkout cria a ref da tag apontando direto para o commit, sem trazer
          # o objeto da tag anotada. Sem este fetch, '%(contents)' devolve a mensagem do
          # COMMIT — foi o que fez o release da 4.0.41 sair com "chore(release): versão
          # 4.0.41" no lugar das notas reais.
          git fetch --tags --force --depth=1 2>/dev/null || true

          # Só usa a mensagem se for de fato uma tag anotada (objeto do tipo 'tag').
          TAG_MESSAGE=""
          if [ "$(git cat-file -t "$VERSION" 2>/dev/null)" = "tag" ]; then
            TAG_MESSAGE=$(git tag -l --format='%(contents)' "$VERSION" 2>/dev/null || echo "")
          fi

          if [ -n "$TAG_MESSAGE" ]; then
            echo "Using annotated tag message"
            echo "$TAG_MESSAGE" > release_notes.md
          else
            echo "Generating release notes from commits"
            # Obter commits desde a última tag
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

            echo "## 🚀 Archbase React $VERSION" > release_notes.md
            echo "" >> release_notes.md

            if [ -n "$PREV_TAG" ]; then
              echo "### Mudanças desde $PREV_TAG" >> release_notes.md
              echo "" >> release_notes.md

              # Agrupar por tipo de commit
              echo "#### Performance" >> release_notes.md
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^perf" 2>/dev/null >> release_notes.md || true
              echo "" >> release_notes.md

              echo "#### Features" >> release_notes.md
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^feat" 2>/dev/null >> release_notes.md || true
              echo "" >> release_notes.md

              echo "#### Bug Fixes" >> release_notes.md
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^fix" 2>/dev/null >> release_notes.md || true
              echo "" >> release_notes.md

              echo "#### Other Changes" >> release_notes.md
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --invert-grep --grep="^perf" --grep="^feat" --grep="^fix" --grep="^chore" --grep="^Merge" 2>/dev/null >> release_notes.md || true
              echo "" >> release_notes.md
            fi
          fi

          # Adicionar seção de packages e instalação
          echo "" >> release_notes.md
          echo "### Packages" >> release_notes.md
          echo "" >> release_notes.md
          echo "- @archbase/core" >> release_notes.md
          echo "- @archbase/data" >> release_notes.md
          echo "- @archbase/components" >> release_notes.md
          echo "- @archbase/layout" >> release_notes.md
          echo "- @archbase/admin" >> release_notes.md
          echo "- @archbase/advanced" >> release_notes.md
          echo "- @archbase/security" >> release_notes.md
          echo "- @archbase/security-ui" >> release_notes.md
          echo "- @archbase/template" >> release_notes.md
          echo "- @archbase/tools" >> release_notes.md
          echo "- @archbase/feature-flags" >> release_notes.md
          echo "- @archbase/ssr" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "npm install @archbase/core@${VERSION#v}" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Documentation" >> release_notes.md
          echo "" >> release_notes.md
          echo "Visit [https://react.archbase.dev](https://react.archbase.dev) for full documentation." >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          body_path: release_notes.md
          # Acrescenta ao corpo acima a lista de PRs e commits desde a release anterior.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
